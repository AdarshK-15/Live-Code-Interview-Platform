<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Technical Interview IDE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden">

    <!-- Top Workspace Header -->
    <header class="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shrink-0 select-none">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="font-bold text-sm tracking-wide text-white">Live Interview Playground</span>
            </div>
            <span class="text-slate-700">|</span>
            <div class="flex items-center gap-2 text-xs">
                <span class="text-slate-400">Session ID:</span>
                <span id="roomDisplay" class="font-mono bg-slate-950 px-2.5 py-1 rounded border border-slate-800 text-cyan-400 font-semibold"></span>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <label class="text-xs text-slate-400 font-medium">Language:</label>
                <select id="languageSelect" class="bg-slate-950 border border-slate-700 text-xs rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-cyan-500 font-mono">
                    <option value="javascript">JavaScript (ES6)</option>
                    <option value="python">Python 3</option>
                    <option value="java">Java 17</option>
                    <option value="cpp">C++ 20</option>
                </select>
            </div>

            <button onclick="runCode()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-1.5 rounded font-semibold transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-play text-[10px]"></i>
                Run Execution
            </button>
        </div>
    </header>

    <!-- Main Editor & Communication Workspace -->
    <div class="flex-1 flex overflow-hidden">

        <!-- Code Editor Section -->
        <div class="flex-1 flex flex-col min-w-0 border-r border-slate-800">
            <div id="editorContainer" class="flex-1 w-full bg-[#1e1e1e]"></div>

            <!-- Terminal Output Drawer -->
            <div class="h-48 bg-slate-950 border-t border-slate-800 flex flex-col shrink-0">
                <div class="h-8 bg-slate-900/80 px-4 flex items-center justify-between border-b border-slate-800/80">
                    <div class="flex items-center gap-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                        <i class="fa-solid fa-terminal text-[11px] text-slate-500"></i>
                        <span>Execution Console</span>
                    </div>
                    <button onclick="clearConsole()" class="text-[11px] text-slate-500 hover:text-slate-300 transition">Clear Console</button>
                </div>
                <div id="consoleOutput" class="flex-1 p-4 font-mono text-xs overflow-y-auto text-emerald-400 whitespace-pre-wrap leading-relaxed">System ready for evaluation.</div>
            </div>
        </div>

        <!-- Sidebar: Active Peer Roster & Chat Stream -->
        <aside class="w-80 bg-slate-900 flex flex-col shrink-0 text-xs select-none">
            
            <!-- Connected Peers -->
            <div class="p-4 border-b border-slate-800">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Active Peers</span>
                    <span id="userCount" class="font-mono bg-slate-950 px-2 py-0.5 rounded text-[10px] text-cyan-400 border border-slate-800 font-bold">0</span>
                </div>
                <div id="userList" class="space-y-1.5">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <!-- Discussion Chat -->
            <div class="flex-1 flex flex-col min-h-0">
                <div class="px-4 pt-3 pb-1 text-[11px] font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-regular fa-comments text-slate-500"></i>
                    <span>Interview Communication</span>
                </div>
                
                <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-2.5">
                    <div class="text-[11px] text-slate-500 text-center italic">Session channel open. Messages are shared across participants.</div>
                </div>

                <form id="chatForm" onsubmit="submitChatMessage(event)" class="p-3 border-t border-slate-800 flex gap-2 bg-slate-950">
                    <input type="text" id="chatInput" placeholder="Send message or algorithm hint..." class="flex-1 bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 font-sans">
                    <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3.5 py-1.5 rounded font-medium transition">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
            </div>

        </aside>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'technical-round-1';
        let defaultName = `Candidate-${Math.floor(Math.random() * 899 + 100)}`;
        const username = prompt("Enter your display name for this technical session:", defaultName) || defaultName;

        document.getElementById('roomDisplay').textContent = roomId;

        let editor;
        let isRemoteUpdate = false;
        let ws;

        // Initialize Monaco Editor
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editorContainer'), {
                value: '// Establishing secure peer session...',
                language: 'javascript',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 13,
                fontFamily: 'JetBrains Mono',
                minimap: { enabled: false },
                scrollBeyondLastLine: false,
                lineNumbers: 'on',
                tabSize: 4
            });

            // Listen for local typing changes
            editor.onDidChangeModelContent(() => {
                if (isRemoteUpdate || !ws || ws.readyState !== WebSocket.OPEN) return;
                const currentCode = editor.getValue();
                ws.send(JSON.stringify({
                    type: 'CODE_CHANGE',
                    code: currentCode
                }));
            });

            setupWebSocket();
        });

        function setupWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const endpoint = `${protocol}//${window.location.host}/ws/${encodeURIComponent(roomId)}?username=${encodeURIComponent(username)}`;
            ws = new WebSocket(endpoint);

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                
                if (message.type === 'INIT_STATE') {
                    setEditorContent(message.code);
                    document.getElementById('languageSelect').value = message.language;
                    updateMonacoLanguage(message.language);
                    refreshUserRoster(message.users);
                }
                else if (message.type === 'CODE_UPDATE') {
                    setEditorContent(message.code);
                }
                else if (message.type === 'LANGUAGE_UPDATE') {
                    document.getElementById('languageSelect').value = message.language;
                    updateMonacoLanguage(message.language);
                    setEditorContent(message.code);
                    appendStatusNote(`Language updated to ${message.language.toUpperCase()}`);
                }
                else if (message.type === 'USER_JOINED') {
                    refreshUserRoster(message.users);
                    appendStatusNote(`${message.username} entered the room`);
                }
                else if (message.type === 'USER_LEFT') {
                    refreshUserRoster(message.users);
                    appendStatusNote(`${message.username} left the room`);
                }
                else if (message.type === 'CHAT_BROADCAST') {
                    renderChatMessage(message.username, message.text, message.time);
                }
            };

            ws.onclose = () => {
                appendStatusNote('Connection lost. Reconnecting...');
                setTimeout(setupWebSocket, 2000);
            };
        }

        function setEditorContent(text) {
            if (!editor) return;
            const currentPosition = editor.getPosition();
            isRemoteUpdate = true;
            editor.setValue(text);
            if (currentPosition) editor.setPosition(currentPosition);
            isRemoteUpdate = false;
        }

        function updateMonacoLanguage(lang) {
            if (!editor) return;
            const langMap = {
                'javascript': 'javascript',
                'python': 'python',
                'java': 'java',
                'cpp': 'cpp'
            };
            monaco.editor.setModelLanguage(editor.getModel(), langMap[lang] || 'javascript');
        }

        function refreshUserRoster(users) {
            document.getElementById('userCount').textContent = users.length;
            const container = document.getElementById('userList');
            container.innerHTML = users.map(u => `
                <div class="flex items-center gap-2 px-2.5 py-1.5 rounded bg-slate-950 border border-slate-800">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
                    <span class="truncate font-medium text-slate-200">${escapeHtml(u)}</span>
                    ${u === username ? '<span class="text-[9px] bg-slate-800 text-slate-400 px-1 rounded ml-auto">You</span>' : ''}
                </div>
            `).join('');
        }

        function renderChatMessage(user, text, time) {
            const container = document.getElementById('chatMessages');
            const wrapper = document.createElement('div');
            const isMe = user === username;
            
            wrapper.className = `p-2.5 rounded border text-xs ${isMe ? 'bg-cyan-950/30 border-cyan-800/40' : 'bg-slate-950 border-slate-800'}`;
            wrapper.innerHTML = `
                <div class="flex justify-between items-center text-[10px] text-slate-400 mb-1">
                    <span class="font-bold ${isMe ? 'text-cyan-400' : 'text-slate-300'}">${escapeHtml(user)}</span>
                    <span class="font-mono text-[9px]">${time}</span>
                </div>
                <div class="text-slate-200 break-words leading-relaxed">${escapeHtml(text)}</div>
            `;
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        function appendStatusNote(text) {
            const container = document.getElementById('chatMessages');
            const note = document.createElement('div');
            note.className = 'text-[10px] text-slate-500 italic py-1 text-center font-mono';
            note.textContent = `— ${text} —`;
            container.appendChild(note);
            container.scrollTop = container.scrollHeight;
        }

        function submitChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const content = input.value.trim();
            if (content && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'CHAT_MESSAGE',
                    text: content
                }));
                input.value = '';
            }
        }

        document.getElementById('languageSelect').addEventListener('change', (e) => {
            const selected = e.target.value;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'LANGUAGE_CHANGE',
                    language: selected
                }));
            }
        });

        // Client-Side Browser Execution Sandbox (JavaScript)
        function runCode() {
            const lang = document.getElementById('languageSelect').value;
            const consoleBox = document.getElementById('consoleOutput');
            consoleBox.textContent = "Executing sequence...\n";

            if (lang !== 'javascript') {
                consoleBox.textContent = `[Info] Active Language: ${lang.toUpperCase()}.\nCode updates synchronize across all peers. For browser execution, switch to JavaScript (ES6).`;
                return;
            }

            const code = editor.getValue();
            let logs = [];

            const originalLog = console.log;
            console.log = function(...args) {
                logs.push(args.map(a => (typeof a === 'object' ? JSON.stringify(a, null, 2) : a)).join(' '));
                originalLog.apply(console, args);
            };

            try {
                const evaluate = new Function(code);
                const ret = evaluate();
                if (ret !== undefined) {
                    logs.push(`--> Return: ${JSON.stringify(ret)}`);
                }
                consoleBox.textContent = logs.join('\n') || '[Process completed with empty stdout]';
            } catch (err) {
                consoleBox.textContent = `Runtime Exception: ${err.message}`;
            } finally {
                console.log = originalLog;
            }
        }

        function clearConsole() {
            document.getElementById('consoleOutput').textContent = '';
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
        }
    </script>
</body>
</html>
